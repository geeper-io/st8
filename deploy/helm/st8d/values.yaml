replicaCount: 1

image:
  repository: ghcr.io/geeper-io/st8d
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8748

# Bearer token authentication. If set, a Secret is created and the token is
# passed to st8d via --token.
auth:
  token: ""
  # Reference an existing Secret instead of creating one.
  # When set, `auth.token` is ignored.
  existingSecret: ""
  existingSecretKey: "token"

# Persistent storage for st8d state.
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  existingClaim: ""

# TLS – mount a Secret containing tls.crt and tls.key.
tls:
  enabled: false
  secretName: ""

resources: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

# Expose a Prometheus ServiceMonitor.
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
